<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpertMed - Косметология Пенза</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.263.1"
            }
        }
    </script>
    <script type="module" src="https://esm.sh/run-css"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Manrope', sans-serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-manrope { font-family: 'Manrope', sans-serif; }
        .expert-cursor {
            position: fixed; top: 0; left: 0; height: 12px; width: 12px;
            background-color: #C42323; border-radius: 50%; pointer-events: none;
            z-index: 9999; transform: translate(-50%, -50%); transition: height 0.3s, width 0.3s;
        }
        .expert-cursor.text {
            height: 32px; width: 32px; background-color: rgba(196, 35, 35, 0.2); border: 1px solid #C42323;
        }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { ChevronRight, ChevronLeft, Star, MapPin, Phone, Instagram, ArrowRight, Menu, X, Check } from 'lucide-react';

        /* --- ДАННЫЕ ВРАЧЕЙ --- */
        const doctorsData = [
            { id: 1, name: "Каргина Ольга Александровна", role: "Врач косметолог-дерматолог", exp: "Стаж более 18 лет", img: "doc1.jpg" },
            { id: 2, name: "Гаевская Марина Александровна", role: "Врач-косметолог", exp: "Высшая категория", img: "doc2.jpg" },
            { id: 3, name: "Гришина Валерия Борисовна", role: "Врач-косметолог, дерматолог", exp: "Стаж более 11 лет", img: "doc3.jpg" },
            { id: 4, name: "Кокчян Ануш Артаковна", role: "Врач-косметолог, дерматолог", exp: "Стаж более 8 лет", img: "doc4.jpg" },
            { id: 5, name: "Бойченко Ирина Анатольевна", role: "Врач-косметолог, дерматолог", exp: "Стаж более 25 лет", img: "doc5.jpg" },
            { id: 6, name: "Арутюнян Анаит Вачиковна", role: "Косметолог-эстетист", exp: "Эстетическая косметология", img: "doc6.jpg" },
            { id: 7, name: "Сазыкина Мария Евгеньевна", role: "Косметолог-эстетист", exp: "Эстетическая косметология", img: "doc7.jpg" }
        ];

        /* --- КОМПОНЕНТЫ --- */

        const ServiceCard = ({ title, desc, price, tags, onEnter, onLeave }) => (
            <div 
                className="group bg-white p-6 md:p-8 rounded-[30px] shadow-sm hover:shadow-xl transition-all duration-300 border border-transparent hover:border-red-100 relative overflow-hidden flex flex-col h-full"
                onMouseEnter={onEnter}
                onMouseLeave={onLeave}
            >
                <div className="absolute top-0 right-0 w-24 h-24 bg-[#F5F1EE] rounded-bl-[100px] transition-all group-hover:bg-[#C42323] -mr-4 -mt-4"></div>
                <div className="absolute top-6 right-6 p-2 bg-white rounded-full shadow-sm z-10 opacity-0 group-hover:opacity-100 transition-all duration-500 transform translate-x-2 group-hover:translate-x-0">
                    <ArrowRight size={20} className="text-[#C42323]" />
                </div>
                <div className="relative z-10 flex flex-col h-full">
                    <div className="flex gap-2 mb-4 md:mb-6">
                        {tags.map((tag, i) => (
                        <span key={i} className="text-[10px] font-bold font-montserrat uppercase tracking-wider bg-[#F5F1EE] px-2 py-1 md:px-3 rounded-full text-gray-500 group-hover:text-[#C42323] transition-colors">
                            {tag}
                        </span>
                        ))}
                    </div>
                    <h3 className="font-montserrat font-bold text-xl md:text-2xl text-[#333333] mb-3 group-hover:text-[#C42323] transition-colors">{title}</h3>
                    <p className="font-manrope text-sm text-gray-500 mb-6 md:mb-8 leading-relaxed">{desc}</p>
                    <div className="mt-auto">
                        <span className="font-montserrat font-bold text-lg text-[#333333]">{price}</span>
                    </div>
                </div>
            </div>
        );

        const DoctorCard = ({ name, role, exp, imageSrc, onEnter, onLeave }) => (
            <div 
                className="group cursor-pointer h-full"
                onMouseEnter={onEnter}
                onMouseLeave={onLeave}
            >
                <div className="relative overflow-hidden rounded-[20px] md:rounded-[30px] mb-4 md:mb-6 aspect-[3/4] bg-[#F5F1EE]">
                    {imageSrc ? (
                        <img 
                            src={imageSrc} 
                            alt={name} 
                            className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                            onError={(e) => {e.target.style.display='none'; e.target.nextSibling.style.display='flex'}}
                        />
                    ) : null}
                    
                    <div className="w-full h-full bg-gray-200 absolute top-0 left-0 flex items-end justify-center" style={{display: imageSrc ? 'none' : 'flex'}}>
                         <span className="text-gray-400 font-manrope text-xs md:text-sm mb-10 pb-10">Фото...</span>
                    </div>
                    
                    <div className="absolute bottom-2 left-2 right-2 md:bottom-4 md:left-4 md:right-4 bg-white/90 backdrop-blur-md p-3 md:p-4 rounded-[15px] md:rounded-[20px] shadow-sm transform translate-y-2 opacity-0 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 z-20">
                        <div className="flex items-center justify-center gap-2 text-[#C42323] font-montserrat font-bold text-xs md:text-sm">
                            Записаться <ChevronRight size={16} />
                        </div>
                    </div>
                </div>
                <h3 className="font-montserrat font-bold text-sm md:text-lg text-[#333333] mb-1 group-hover:text-[#C42323] transition-colors leading-tight">{name}</h3>
                <p className="font-manrope text-xs md:text-sm text-[#C42323] mb-1">{role}</p>
                <p className="font-manrope text-[10px] md:text-xs text-gray-500">{exp}</p>
            </div>
        );

        const DoctorSlider = ({ doctors, onEnter, onLeave }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [itemsPerPage, setItemsPerPage] = useState(4);

            useEffect(() => {
                const handleResize = () => {
                    if (window.innerWidth < 1024) setItemsPerPage(2);
                    else setItemsPerPage(4);
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const nextSlide = () => {
                if (currentIndex < doctors.length - itemsPerPage) {
                    setCurrentIndex(prev => prev + 1);
                }
            };

            const prevSlide = () => {
                if (currentIndex > 0) {
                    setCurrentIndex(prev => prev - 1);
                }
            };

            const isEnd = currentIndex >= doctors.length - itemsPerPage;
            const isStart = currentIndex === 0;

            return (
                <div className="relative group/slider">
                    <div className="absolute top-1/2 -left-4 md:-left-12 -translate-y-1/2 z-20 opacity-100 md:opacity-0 md:group-hover/slider:opacity-100 transition-opacity">
                        <button 
                            onClick={prevSlide}
                            disabled={isStart}
                            className={`p-2 md:p-3 rounded-full shadow-lg bg-white text-[#C42323] hover:bg-[#C42323] hover:text-white transition-all disabled:opacity-0 disabled:cursor-not-allowed`}
                        >
                            <ChevronLeft size={20} />
                        </button>
                    </div>
                    <div className="absolute top-1/2 -right-4 md:-right-12 -translate-y-1/2 z-20 opacity-100 md:opacity-0 md:group-hover/slider:opacity-100 transition-opacity">
                        <button 
                            onClick={nextSlide}
                            disabled={isEnd}
                            className={`p-2 md:p-3 rounded-full shadow-lg bg-white text-[#C42323] hover:bg-[#C42323] hover:text-white transition-all disabled:opacity-0 disabled:cursor-not-allowed`}
                        >
                            <ChevronRight size={20} />
                        </button>
                    </div>

                    <div className="overflow-hidden p-2 -m-2">
                        <div 
                            className="flex transition-transform duration-500 ease-in-out"
                            style={{ transform: `translateX(-${currentIndex * (100 / itemsPerPage)}%)` }}
                        >
                            {doctors.map((doc) => (
                                <div 
                                    key={doc.id} 
                                    className="flex-shrink-0 px-2 md:px-3 box-border"
                                    style={{ width: `${100 / itemsPerPage}%` }}
                                >
                                    <DoctorCard 
                                        name={doc.name} 
                                        role={doc.role} 
                                        exp={doc.exp} 
                                        imageSrc={doc.img} 
                                        onEnter={onEnter} 
                                        onLeave={onLeave} 
                                    />
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [mousePosition, setMousePosition] = useState({ x: 0, y: 0 });
            const [cursorVariant, setCursorVariant] = useState("default");

            useEffect(() => {
                const mouseMove = (e) => setMousePosition({ x: e.clientX, y: e.clientY });
                window.addEventListener("mousemove", mouseMove);
                return () => window.removeEventListener("mousemove", mouseMove);
            }, []);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const textEnter = () => setCursorVariant("text");
            const textLeave = () => setCursorVariant("default");

            return (
                <div className="font-manrope text-[#333333] bg-white overflow-x-hidden selection:bg-[#C42323] selection:text-white relative">
                
                <div className={`expert-cursor hidden md:block ${cursorVariant}`} style={{ left: `${mousePosition.x}px`, top: `${mousePosition.y}px` }} />

                {/* --- HEADER --- */}
                <header className={`fixed w-full top-0 z-50 transition-all duration-300 ${scrolled ? 'bg-white/90 backdrop-blur-md shadow-sm py-3' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-4 md:px-8 flex justify-between items-center">
                    <div className="flex flex-col leading-none cursor-pointer" onMouseEnter={textEnter} onMouseLeave={textLeave}>
                        <span className="font-montserrat font-bold text-2xl md:text-3xl text-[#C42323] tracking-tight">expertmed</span>
                        <span className="font-montserrat text-xs md:text-sm text-[#333333] tracking-widest text-center mt-1">КОСМЕТОЛОГИЯ</span>
                    </div>
                    <nav className="hidden lg:flex items-center gap-8 font-montserrat font-medium text-sm">
                        {['Услуги', 'Врачи', 'О Клинике', 'Прайс', 'Контакты'].map((item) => (
                        <a key={item} href={`#${item.toLowerCase()}`} className="hover:text-[#C42323] transition-colors relative group" onMouseEnter={textEnter} onMouseLeave={textLeave}>
                            {item}
                            <span className="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#C42323] transition-all group-hover:w-full"></span>
                        </a>
                        ))}
                    </nav>
                    <div className="hidden lg:flex items-center gap-6">
                        <a href="tel:709111" className="font-manrope font-semibold hover:text-[#C42323] transition-colors">709-111</a>
                        <button className="bg-[#C42323] text-white font-montserrat font-medium px-6 py-3 rounded-[20px] hover:bg-[#a01c1c] transition-all transform hover:scale-105 shadow-lg shadow-red-200">
                        Записаться
                        </button>
                    </div>
                    <button className="lg:hidden text-[#333333]" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                        {isMenuOpen ? <X size={28} /> : <Menu size={28} />}
                    </button>
                    </div>
                </header>

                {isMenuOpen && (
                    <div className="fixed inset-0 bg-white z-40 flex flex-col items-center justify-center gap-8 pt-20">
                    {['Услуги', 'Врачи', 'О Клинике', 'Прайс', 'Контакты'].map((item) => (
                        <a key={item} href={`#${item.toLowerCase()}`} className="font-montserrat text-2xl font-bold text-[#333333]" onClick={() => setIsMenuOpen(false)}>
                        {item}
                        </a>
                    ))}
                    </div>
                )}

                {/* --- HERO SECTION --- */}
                <section className="relative min-h-screen flex items-center bg-[#F5F1EE] pt-20 overflow-hidden">
                    <div className="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-b from-white to-transparent opacity-50 z-0 pointer-events-none"></div>
                    <div className="absolute -right-20 top-1/4 w-[500px] h-[500px] bg-[#E0E2E4] rounded-full blur-3xl opacity-30 animate-pulse"></div>

                    <div className="container mx-auto px-4 md:px-8 relative z-10 grid lg:grid-cols-2 gap-12 items-center">
                    <div className="max-w-2xl">
                        <div className="inline-flex items-center gap-2 mb-6 px-4 py-2 bg-white rounded-full shadow-sm">
                        <span className="w-2 h-2 rounded-full bg-[#C42323]"></span>
                        <span className="text-xs font-bold font-montserrat uppercase tracking-wider text-gray-500">Медицинская лицензия Л041-01166-58</span>
                        </div>
                        <h1 className="font-montserrat font-extrabold text-4xl md:text-6xl lg:text-7xl leading-[1.1] text-[#333333] mb-6">
                        КРАСОТА,<br />ОСНОВАННАЯ<br />НА <span className="text-[#C42323]">НАУКЕ</span>
                        </h1>
                        <p className="font-manrope text-lg text-gray-600 mb-10 max-w-lg leading-relaxed">
                        Врачебная косметология и гинекология в Пензе. Прогнозируемый результат, передовые лазерные технологии и отсутствие длительной реабилитации.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-4">
                        <button className="bg-[#C42323] text-white font-montserrat font-bold px-8 py-4 rounded-[20px] hover:bg-[#a01c1c] transition-all flex items-center justify-center gap-2 shadow-xl shadow-red-200" onMouseEnter={textEnter} onMouseLeave={textLeave}>
                            Записаться на консультацию <ArrowRight size={20} />
                        </button>
                        <button className="bg-white text-[#333333] border border-gray-200 font-montserrat font-semibold px-8 py-4 rounded-[20px] hover:border-[#C42323] hover:text-[#C42323] transition-all">
                            Наши услуги
                        </button>
                        </div>
                    </div>

                    <div className="relative hidden lg:block h-[700px]">
                        <div className="relative w-full h-full rounded-[40px] overflow-hidden shadow-2xl">
                            <img src="main.jpg" alt="Красивая кожа" className="w-full h-full object-cover" 
                                 onError={(e) => {e.target.style.display='none'; e.target.nextSibling.style.display='block'}} />
                            
                            <svg className="w-full h-full object-cover bg-gray-100 hidden" viewBox="0 0 400 600" preserveAspectRatio="none">
                                <rect width="100%" height="100%" fill="#e5e7eb"/>
                                <text x="50%" y="50%" dominantBaseline="middle" textAnchor="middle" fill="#9ca3af" fontSize="20">Загрузите main.jpg</text>
                            </svg>
                        
                            <div className="absolute bottom-10 left-10 bg-white/80 backdrop-blur-md p-6 rounded-[20px] shadow-lg max-w-xs animate-bounce-slow">
                                <div className="flex items-center gap-3 mb-2">
                                <div className="p-2 bg-[#F5F1EE] rounded-full text-[#C42323]"><Star size={16} fill="#C42323" /></div>
                                <span className="font-montserrat font-bold text-sm">BBL HERO</span>
                                </div>
                                <p className="text-xs text-gray-600">Кожа без фильтров. Ровный тон и сияние за 1 процедуру.</p>
                            </div>
                        </div>
                    </div>
                    </div>
                </section>

                {/* --- PHILOSOPHY SECTION --- */}
                <section className="py-24 bg-white" id="о клинике">
                    <div className="container mx-auto px-4 md:px-8">
                    <div className="grid md:grid-cols-2 gap-16">
                        <div>
                        <span className="font-montserrat font-bold text-[#C42323] text-sm uppercase tracking-widest mb-4 block">Философия</span>
                        <h2 className="font-montserrat font-extrabold text-3xl md:text-5xl text-[#333333] mb-8 leading-tight">
                            МЫ НЕ ЛЕЧИМ ПРОБЛЕМЫ,<br /> МЫ РЕАЛИЗУЕМ <span className="text-gray-400">ЖЕЛАНИЯ</span>
                        </h2>
                        </div>
                        <div className="flex flex-col justify-center">
                        <p className="font-manrope text-lg text-gray-600 mb-6">Expertmed — это центр врачебной косметологии, где безопасность пациента стоит на первом месте. Мы используем только сертифицированные препараты и оригинальное оборудование экспертного класса.</p>
                        <ul className="space-y-4 font-manrope font-medium text-[#333333]">
                            {['Медицинская лицензия и строгие стандарты', 'Врачи с опытом более 10 лет', 'Оригинальные аппараты Fotona, BBL, Liftera', 'Отсутствие гиперкоррекции ("пластиковых" лиц)'].map((item, i) => (
                            <li key={i} className="flex items-start gap-3">
                                <span className="min-w-[8px] h-[8px] mt-2 rounded-full bg-[#C42323]"></span>
                                {item}
                            </li>
                            ))}
                        </ul>
                        </div>
                    </div>
                    </div>
                </section>

                {/* --- SERVICES --- */}
                <section className="py-24 bg-[#F5F1EE]" id="услуги">
                    <div className="container mx-auto px-4 md:px-8">
                    <h2 className="font-montserrat font-extrabold text-3xl md:text-5xl text-[#333333] mb-12">ПОПУЛЯРНЫЕ ПРОЦЕДУРЫ</h2>
                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <ServiceCard title="BBL HERO" desc="Фототерапия. Удаление пигментации, сосудов и лечение акне." price="от 6 000 ₽" tags={['Ровный тон', 'Сияние']} onEnter={textEnter} onLeave={textLeave} />
                        <ServiceCard title="SMAS LIFTERA" desc="Безоперационная подтяжка лица." price="от 15 000 ₽" tags={['Лифтинг', 'Четкий контур']} onEnter={textEnter} onLeave={textLeave} />
                        <ServiceCard title="FOTONA 4D" desc="Многоуровневое лазерное омоложение." price="от 31 800 ₽" tags={['Омоложение', 'Без боли']} onEnter={textEnter} onLeave={textLeave} />
                        <ServiceCard title="Контурная пластика" desc="Коррекция губ, скул и подбородка филлерами." price="от 13 800 ₽" tags={['Объем', 'Гармония']} onEnter={textEnter} onLeave={textLeave} />
                        <ServiceCard title="Гинекология" desc="Лазерное омоложение Fotona." price="от 10 490 ₽" tags={['Здоровье', 'Комфорт']} onEnter={textEnter} onLeave={textLeave} />
                        <ServiceCard title="Удаление новообразований" desc="Радиоволновой метод и лазер." price="от 700 ₽" tags={['Чистая кожа', 'Безопасность']} onEnter={textEnter} onLeave={textLeave} />
                    </div>
                    </div>
                </section>

                {/* --- DOCTORS --- */}
                <section className="py-24 bg-white" id="врачи">
                    <div className="container mx-auto px-4 md:px-8">
                        <h2 className="font-montserrat font-extrabold text-3xl md:text-5xl text-[#333333] mb-16">ЭКСПЕРТИЗА В ЛИЦАХ</h2>
                        <DoctorSlider doctors={doctorsData} onEnter={textEnter} onLeave={textLeave} />
                    </div>
                </section>

                {/* --- BEFORE / AFTER (RESTORED FULL) --- */}
                <section className="py-24 bg-[#333333] text-white overflow-hidden">
                    <div className="container mx-auto px-4 md:px-8">
                    <div className="grid lg:grid-cols-2 gap-16 items-center">
                        <div>
                            <span className="font-montserrat font-bold text-[#C42323] text-sm uppercase tracking-widest mb-4 block">Результаты</span>
                            <h2 className="font-montserrat font-extrabold text-3xl md:text-5xl mb-8">ДОКАЗАТЕЛЬНАЯ<br />ЭСТЕТИКА</h2>
                            <p className="font-manrope text-gray-300 text-lg mb-8 max-w-md">Мы документируем результаты в макро-качестве. Никакого фотошопа, только честная медицина и возможности вашего организма.</p>
                            
                            {/* Возвращаем статистику */}
                            <div className="flex gap-8">
                                <div className="border-l-2 border-[#C42323] pl-4">
                                    <p className="font-montserrat font-bold text-3xl">100%</p>
                                    <p className="font-manrope text-sm text-gray-400 mt-1">Оригинальные препараты</p>
                                </div>
                                <div className="border-l-2 border-[#C42323] pl-4">
                                    <p className="font-montserrat font-bold text-3xl">4000+</p>
                                    <p className="font-manrope text-sm text-gray-400 mt-1">Довольных пациентов</p>
                                </div>
                            </div>
                        </div>
                        <div className="relative">
                            <div className="grid grid-cols-2 gap-4">
                            <div className="bg-gray-800 rounded-[20px] aspect-[3/4] overflow-hidden relative group">
                                <div className="absolute top-4 left-4 bg-black/50 backdrop-blur px-3 py-1 rounded-full text-xs font-bold z-10">ДО</div>
                                <img src="before.jpg" className="w-full h-full object-cover" onError={(e) => e.target.style.display='none'} />
                                <div className="w-full h-full bg-gray-700 absolute top-0 left-0 flex items-center justify-center text-gray-500 -z-10">Фото</div>
                            </div>
                            <div className="bg-gray-800 rounded-[20px] aspect-[3/4] overflow-hidden relative group translate-y-8">
                                <div className="absolute top-4 left-4 bg-[#C42323] px-3 py-1 rounded-full text-xs font-bold z-10">ПОСЛЕ</div>
                                <img src="after.jpg" className="w-full h-full object-cover" onError={(e) => e.target.style.display='none'} />
                                <div className="w-full h-full bg-gray-600 absolute top-0 left-0 flex items-center justify-center text-gray-400 -z-10">Фото</div>
                            </div>
                            </div>
                        </div>
                    </div>
                    </div>
